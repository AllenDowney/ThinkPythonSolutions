name: tests

on:
  push:
    branches: [v3]
  pull_request:
  schedule:
    # Run on the first of every month
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every leg; one broken chapter should not hide the others.
      fail-fast: false
      matrix:
        # Windows is back as of 2026-10-14. It was excluded because the book
        # taught `open(filename)` with no encoding argument, so under a cp1252
        # locale the Project Gutenberg texts in chapters 8, 11 and 12 raised
        # UnicodeDecodeError on byte 0x9d. Those chapters now pass
        # encoding='utf-8' explicitly, so this leg is what proves the fix --
        # do not paper over a failure here with PYTHONUTF8=1, because readers
        # on Windows do not have that set either.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        # bash on every runner: Windows defaults to pwsh, and neither pwsh nor
        # cmd expands chap*.ipynb, so pytest would be handed the literal glob.
        shell: bash
        run: |
          make tests
